# Initial HTTP configuration. Certbot adds HTTPS after DNS is ready.
server {
    listen 80;
    listen [::]:80;
    server_name brain2jeu.leofinance.fr;

    root /var/www/brain2jeu/current;
    index index.html;

    access_log /var/log/nginx/brain2jeu.access.log;
    error_log /var/log/nginx/brain2jeu.error.log;

    # Revalidate HTML and unversioned files on each visit.
    add_header Cache-Control "no-cache";

    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Vite gives these assets content hashes; missing assets must return 404.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
